version: 2

sources:
  - name: raw
    description: >
      Raw experiment data loaded into BigQuery before dbt transformations.
      These tables represent source-system data and are not modified directly.

    database: retailanalytics-cloud
    schema: raw

    tables:
      - name: experiment_metadata

        description: >
          Experiment configuration table containing experiment-level
          information such as dates and promotion identifiers.
          Grain is one row per experiment.

        columns:
          - name: ExperimentID
            description: Unique identifier for the experiment.
            tests:
              - not_null
              - unique

          - name: PromotionID
            description: Promotion or treatment identifier associated with the experiment.

          - name: StartDate
            description: Date the experiment begins.

          - name: EndDate
            description: Date the experiment ends.


      - name: fact_customer_experiment

        description: >
          Customer-level experiment fact table containing customer assignments,
          purchases, revenue, profit, and returns.
          Grain is one row per customer per experiment.

        columns:
          - name: ExperimentID
            description: Experiment identifier.
            tests:
              - not_null

          - name: CustomerID
            description: Customer assigned to the experiment.
            tests:
              - not_null

          - name: GroupName
            description: >
              Experiment group assignment. Values should be Control or Treatment.

          - name: Purchased
            description: >
              Indicates whether the customer completed a purchase during
              the experiment period.

          - name: PurchaseDate
            description: Date of customer purchase.

          - name: Revenue
            description: Revenue generated by the customer.

          - name: Profit
            description: Profit generated after costs.

          - name: Returned
            description: Indicates whether the customer returned an item.

          - name: ReturnAmount
            description: Amount associated with returned items.