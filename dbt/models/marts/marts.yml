version: 2

models:
  - name: mart_experiment_results

    description: >
      Business-facing experiment results mart containing control versus
      treatment performance comparisons and calculated experiment impact metrics.
      Grain is one row per experiment.

    columns:
      - name: ExperimentID
        description: Unique identifier for the experiment.
        tests:
          - not_null
          - unique

      - name: PromotionID
        description: Promotion or treatment identifier associated with the experiment.

      - name: ControlPurchaseRate
        description: Percentage of control group customers who purchased.

      - name: TreatmentPurchaseRate
        description: Percentage of treatment group customers who purchased.

      - name: AbsoluteLift
        description: Difference between treatment and control purchase rates.

      - name: RelativeLift
        description: Percentage improvement of treatment compared with control.

      - name: IncrementalCustomers
        description: Estimated additional customers gained due to the treatment.

      - name: IncrementalRevenue
        description: Estimated additional revenue generated by the treatment.

      - name: IncrementalProfit
        description: Estimated additional profit generated by the treatment.

  - name: mart_experiment_group_metrics

    description: >
      Detailed experiment performance mart showing metrics by experiment group.
      Used for Power BI analysis comparing Control and Treatment performance.
      Grain is one row per experiment and group.

    columns:
      - name: ExperimentID
        description: Unique identifier for the experiment.
        tests:
          - not_null

      - name: GroupName
        description: Experiment assignment group (Control or Treatment).
        tests:
          - accepted_values:
              arguments:
                values:
                  - Control
                  - Treatment

      - name: CustomerCount
        description: Number of customers assigned to the experiment group.

      - name: PurchaserCount
        description: Number of customers who completed a purchase.

      - name: PurchaseRate
        description: Percentage of customers who purchased.

      - name: TotalRevenue
        description: Total revenue generated by the experiment group.

      - name: TotalProfit
        description: Total profit generated by the experiment group.

      - name: ProfitMargin
        description: Profit as a percentage of revenue.

  - name: mart_experiment_statistics

    description: >
      Statistical analysis mart evaluating whether differences between
      Control and Treatment groups are statistically significant.
      Grain is one row per experiment.

    columns:
      - name: ExperimentID
        description: Unique identifier for the experiment.
        tests:
          - not_null
          - unique

      - name: ControlPurchaseRate
        description: Conversion rate for the control group.

      - name: TreatmentPurchaseRate
        description: Conversion rate for the treatment group.

      - name: AbsoluteLift
        description: Difference between treatment and control conversion rates.

      - name: RelativeLift
        description: Relative improvement compared with control.

      - name: ZScore
        description: Standardized test statistic measuring difference between groups.

      - name: IsSignificant
        description: Indicates whether the experiment result meets the statistical significance threshold.

      - name: Recommendation
        description: Business recommendation based on experiment outcome.