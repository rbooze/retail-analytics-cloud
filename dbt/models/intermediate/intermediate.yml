version: 2

models:
  - name: int_experiment_metrics

    description: >
      Intermediate experiment metrics model calculating performance
      measures by experiment and experiment group.
      This model provides reusable calculations for downstream marts.
      Grain is one row per ExperimentID and GroupName.

    columns:
      - name: ExperimentID
        description: Unique identifier for the experiment.
        tests:
          - not_null

      - name: GroupName
        description: >
          Experiment assignment group indicating whether customers
          belong to the Control or Treatment group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Control
                  - Treatment

      - name: CustomerCount
        description: >
          Total number of customers assigned to the experiment group.

      - name: PurchaserCount
        description: >
          Number of customers in the experiment group who completed
          a purchase during the experiment period.

      - name: PurchaseRate
        description: >
          Percentage of customers in the experiment group who purchased.
          Calculated as PurchaserCount divided by CustomerCount.

      - name: TotalRevenue
        description: >
          Total revenue generated by customers in the experiment group.

      - name: TotalProfit
        description: >
          Total profit generated by customers in the experiment group.

      - name: ProfitMargin
        description: >
          Profit percentage calculated as TotalProfit divided by TotalRevenue.